<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive To-Do List</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-card">
    <header class="app-header">
      <h1>To-Do List</h1>
      <p class="subtitle">Stay organized and get things done</p>
    </header>

    <!-- Task Input Form -->
    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        aria-label="New task description"
      />
      <button type="submit" id="add-btn" class="btn btn-primary">Add</button>
    </form>

    <!-- Filter and Bulk Action Controls -->
    <div class="controls-bar">
      <div class="filter-group" role="group" aria-label="Filter tasks">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="done">Done</button>
      </div>
      <button type="button" id="clear-completed-btn" class="btn btn-outline">
        Clear completed
      </button>
    </div>

    <!-- Remaining Tasks Counter -->
    <p id="remaining-count" class="remaining-count" aria-live="polite">
      0 tasks remaining
    </p>

    <!-- Task List -->
    <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
  </div>
</body>
</html>
